<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜のノート</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夜のノート">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app, night-desk feel — ink-blue ground, a single lamp-amber accent, bottom tab bar */
:root{
  --bg:#0f1524; --surface:#172036; --surface2:#1f2a44; --line:#2a3654;
  --fg:#e7e9f0; --muted:#8f9bb8; --accent:#e8b86a; --accent-ink:#1a1408;
  --moon:#a8bbeb; --good:#7cc4a4; --heat0:#1c2640;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e4e9f2; --line:#d3dae6;
  --fg:#1a2236; --muted:#5d6a85; --accent:#a86d14; --accent-ink:#ffffff;
  --moon:#4a63a8; --good:#2f8a63; --heat0:#e1e6ef; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e4e9f2; --line:#d3dae6;
  --fg:#1a2236; --muted:#5d6a85; --accent:#a86d14; --accent-ink:#ffffff;
  --moon:#4a63a8; --good:#2f8a63; --heat0:#e1e6ef; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.65rem;letter-spacing:.02em}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-family:var(--mono)}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.moon{width:38px;height:38px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 65% 35%,transparent 44%,var(--moon) 45%);opacity:.9}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.82rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:baseline;gap:10px}
.step .n{font-family:var(--mono);font-size:.78rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;flex:none}
.done-tag{margin-left:auto;font-size:.75rem;color:var(--good);flex:none}

button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* breathing */
.breath{display:grid;place-items:center;height:220px;position:relative}
.ring{position:absolute;width:190px;height:190px;border-radius:50%;border:1px solid var(--line)}
.orb{width:86px;height:86px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--accent) 85%,white),color-mix(in srgb,var(--accent) 35%,transparent) 70%);
  transform:scale(1);transition-property:transform;transition-timing-function:ease-in-out}
.breath-label{position:absolute;bottom:6px;font-size:.9rem;color:var(--muted)}
.clock{font-family:var(--mono);font-size:2.4rem;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em}

label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500}
textarea,input[type=text],input[type=search]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:64px;resize:vertical}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood .chip{padding:6px 2px;font-size:.75rem;text-align:center;border-radius:10px}

.habit{display:flex;align-items:center;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;flex:none;padding:0}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"]::after{content:"";width:10px;height:6px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.habit .name{flex:1;min-width:0}
.dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--heat0);border:0;padding:0}
.dot.on{background:var(--good)}
.hblock{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.hblock:first-child{border-top:0;padding-top:0}
.hhead{display:flex;align-items:baseline;gap:10px}
.hhead .name{flex:1;min-width:0;font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--heat0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 0;
  font-family:var(--mono);line-height:1.2;color:var(--muted);touch-action:manipulation;transition:transform .1s}
.cell .w{font-size:.66rem}
.cell .n{font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--fg)}
.cell.on{background:var(--good);border-color:var(--good);color:var(--bg)}
.cell.on .n{color:var(--bg);font-weight:500}
.cell.today{border-color:var(--accent)}
.cell.on.today{box-shadow:0 0 0 2px var(--accent)}
.cell:active{transform:scale(.94)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.en{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.en dl{margin:0;display:flex;flex-direction:column;gap:8px}
.en dt{font-size:.74rem;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}
.en dd{margin:0;font-size:.95rem;line-height:1.55}
.learn .en-line{font-size:.85rem;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 0;font-size:.78rem;color:var(--muted);flex:none}
.streak{font-family:var(--mono);font-size:.78rem;color:var(--accent);min-width:3.2em;text-align:right}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .v{font-family:var(--mono);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:.8rem;color:var(--muted);margin-left:2px}
.stat .k{font-size:.78rem;color:var(--muted)}

.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(16px,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--heat0);display:block}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--heat0))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 62%,var(--heat0))}
.heat i.l3{background:var(--accent)}
.heat i.fut{background:transparent}
.heat i.today{outline:1.5px solid var(--fg);outline-offset:1px}
.legend{display:flex;gap:4px;align-items:center;font-size:.72rem;color:var(--muted);justify-content:flex-end}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.learn{display:flex;flex-direction:column;gap:4px;padding-block:12px;border-top:1px solid var(--line)}
.learn:first-child{border-top:0}
.learn .d{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.recall{background:var(--surface2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.recall blockquote{margin:0;font-family:var(--display);font-size:1.08rem;line-height:1.6}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:8px 0;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
svg.spark text{fill:var(--muted);font-family:var(--mono);font-size:9px}
@media (prefers-reduced-motion: reduce){.orb{transition:none!important}.toast{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow mono" id="today-label"></div>
      <h1 id="greet">今日もおつかれさまでした</h1>
    </div>
    <div class="moon" aria-hidden="true"></div>
  </header>

  <div class="banner" id="sample-banner" hidden>
    <span>過去45日分はサンプルの記録です。</span>
    <button class="btn ghost small" id="clear-sample">消して自分の記録を始める</button>
  </div>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="メニュー">
  <div class="inner">
    <button class="tab" data-tab="tonight"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>今夜</button>
    <button class="tab" data-tab="habits"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg>習慣</button>
    <button class="tab" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>学び</button>
    <button class="tab" data-tab="life"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="4" height="4"/><rect x="10" y="4" width="4" height="4"/><rect x="16" y="4" width="4" height="4"/><rect x="4" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="4" y="16" width="4" height="4"/></svg>記録</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>
<label id="hap" class="vh" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script>
const KEY = 'yoru-note-v1';
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
let RESET = 2; // 1日の切り替え時刻（時）
function base(){ const d = new Date(Date.now() - RESET*3600e3); d.setHours(12,0,0,0); return d; }
let TODAY = ymd(base());
function refreshDay(){ const t = ymd(base()); if (t !== TODAY){ TODAY = t; return true; } return false; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','月','火','水','木','金','土'];
const MOODS = ['ぐったり','いまいち','ふつう','まずまず','いい日'];

/* ---------- data ---------- */
function seed(){
  let r = 7; const rnd = () => (r = (r*16807) % 2147483647) / 2147483647;
  const habits = [
    {id:'h1', name:'22時以降はスマホを置く'},
    {id:'h2', name:'読書 10ページ'},
    {id:'h3', name:'ストレッチ 5分'},
    {id:'h4', name:'英単語 10個'}
  ];
  const goods = ['企画書が一発で通った','後輩に感謝された','定時で上がれた','昼に散歩できた','難しい商談をまとめられた','家族と夕飯を食べた','会議を15分早く終えられた'];
  const learnsText = [
    '会議の冒頭でゴールを一行で共有すると脱線しない',
    'ピボットテーブルで月次集計が5分になった',
    '断るときは代案をひとつ添えると角が立たない',
    '「circle back」は後で改めて話す、という意味',
    '寝る前のスマホを15分減らすと寝つきが良い',
    '1on1は相手に7割話してもらうと本音が出る',
    '資料は結論→理由→次のアクションの順で書く',
    'ポモドーロ25分×4で午前中に資料が完成した',
    '数字は前年比と目標比の両方で見る',
    '疲れた日は「完璧より完了」で切り上げる',
    'メールの件名に期限を入れると返信が早い',
    '怒りは6秒待つと言葉を選べる'
  ];
  const nexts = ['朝イチで見積を送る','10時の会議の論点を3つ書く','部長に進捗を一言報告','早めに寝る','経費精算を終わらせる'];
  const days = {}, learns = [];
  for (let i = 45; i >= 1; i--){
    if (rnd() < 0.24) continue;
    const date = ymd(addDays(base(), -i));
    const d = { med:[3,5,5,10,0][Math.floor(rnd()*5)], mood: 2+Math.floor(rnd()*3.6), good:'', next:'', habits:[] };
    if (rnd() < 0.85){ d.good = goods[Math.floor(rnd()*goods.length)]; d.next = nexts[Math.floor(rnd()*nexts.length)]; d.journal = true; }
    habits.forEach(h => { if (rnd() < 0.62) d.habits.push(h.id); });
    if (d.journal && rnd() < 0.5 && learns.length < learnsText.length){
      const id = 'l'+i; learns.push({id, date, text: learnsText[learns.length]}); d.learnId = id;
    }
    days[date] = d;
  }
  return { habits, days, learns, sample:true };
}
function load(){ try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e){} return seed(); }
let S = load();
S.settings = Object.assign({ resetHour:2, iosTimer:false }, S.settings);
RESET = S.settings.resetHour; TODAY = ymd(base());
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const day = date => S.days[date] || (S.days[date] = { med:0, mood:0, good:'', next:'', habits:[] });
const peek = date => S.days[date];
const active = d => d && (d.med > 0 || d.journal || (d.habits && d.habits.length));

function streakOf(test){
  let n = 0, cur = base();
  if (!test(peek(ymd(cur)))) cur = addDays(cur,-1);
  while (test(peek(ymd(cur)))){ n++; cur = addDays(cur,-1); }
  return n;
}

/* ---------- ui helpers ---------- */
const view = document.getElementById('view');
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1800); }
function header(){
  const now = base();
  document.getElementById('today-label').textContent = `${now.getMonth()+1}月${now.getDate()}日 (${WD[now.getDay()]})`;
  const h = new Date().getHours();
  document.getElementById('greet').textContent = h >= 18 || h < 4 ? '今日もおつかれさまでした' : h < 11 ? 'おはようございます' : '今夜の準備をしておきましょう';
  document.getElementById('sample-banner').hidden = !S.sample;
}

/* ---------- tonight ---------- */
const TKEY = KEY + '-timer';
let timer = { total:300, left:300, running:false, endAt:0, startDay:'', iv:null, phaseT:null };
const PHASES = [['吸って',4,1.75],['止めて',2,1.75],['吐いて',6,1]];
let wake = null;
function saveTimer(){
  try {
    if (timer.running) localStorage.setItem(TKEY, JSON.stringify({ total:timer.total, endAt:timer.endAt, startDay:timer.startDay }));
    else localStorage.removeItem(TKEY);
  } catch(e){}
}

function viewTonight(){
  const d = peek(TODAY) || {};
  const doneMed = d.med > 0, doneJ = !!d.journal;
  view.innerHTML = `
  <div style="display:flex;flex-direction:column;gap:16px">
    <section class="panel" aria-labelledby="s1">
      <div class="step"><span class="n">1</span><h2 id="s1">呼吸を整える</h2>${doneMed?`<span class="done-tag">今日 ${d.med}分 済み</span>`:''}</div>
      <p class="muted small">4秒吸って、2秒止めて、6秒吐く。円の動きに合わせるだけで大丈夫です。</p>
      <div class="row" role="group" aria-label="時間">
        ${[3,5,10,15].map(m=>`<button class="chip" data-min="${m}" aria-pressed="${timer.total===m*60}">${m}分</button>`).join('')}
      </div>
      <div class="breath"><div class="ring"></div><div class="orb" id="orb"></div><div class="breath-label" id="blabel">準備ができたら開始</div></div>
      <div class="clock" id="clock">${fmt(timer.left)}</div>
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="tstart">${timer.running?'一時停止':'開始'}</button>
        <button class="btn ghost" id="treset">リセット</button>
      </div>
      <p class="muted small" style="text-align:center">画面を消しても、ほかのアプリに移っても時間は進みます。終了の音と振動は画面がついているときに鳴ります。</p>
    </section>

    <section class="panel" aria-labelledby="s2">
      <div class="step"><span class="n">2</span><h2 id="s2">一日をふりかえる</h2>${doneJ?'<span class="done-tag">保存済み</span>':''}</div>
      <div class="f"><span class="small" style="font-weight:500">今日の調子</span>
        <div class="mood" role="group" aria-label="今日の調子">
          ${MOODS.map((m,i)=>`<button class="chip" data-mood="${i+1}" aria-pressed="${d.mood===i+1}">${m}</button>`).join('')}
        </div>
      </div>
      <label class="f">良かったこと<textarea id="j-good" placeholder="小さなことでOK。例：会議を早く終えられた">${esc(d.good)}</textarea></label>
      <label class="f">今日の学び<textarea id="j-learn" placeholder="仕事でも生活でも。学びタブに積み上がります">${esc((S.learns.find(l=>l.id===d.learnId)||{}).text)}</textarea></label>
      <label class="f">明日の一歩<input type="text" id="j-next" placeholder="例：朝イチで見積を送る" value="${esc(d.next)}"></label>
      <div class="row">
        <button class="btn primary" id="jsave" style="flex:1">ふりかえりを保存</button>
        <button class="btn" id="jtrans">英語にする</button>
      </div>
      <div id="en-box">${enBlock(d)}</div>
      ${doneJ?`<button class="linkbtn" id="jmove" style="align-self:flex-start">${pendingMove?'もう一度押すと、昨日の分に移して空欄にします':'これは昨日の記入？ → 昨日の分に移して新しく書く'}</button>`:''}
    </section>

    <section class="panel" aria-labelledby="s3">

      <div>${S.habits.map(h=>`
        <div class="habit">
          <button class="check" data-habit="${h.id}" aria-pressed="${(d.habits||[]).includes(h.id)}" aria-label="${esc(h.name)}"></button>
          <span class="name">${esc(h.name)}</span>

        </div>`).join('') || '<p class="muted small">習慣タブで追加できます。</p>'}</div>
    </section>
  </div>`;

  view.querySelectorAll('[data-min]').forEach(b => b.onclick = () => { if (timer.running) return; timer.total = timer.left = +b.dataset.min*60; viewTonight(); });
  document.getElementById('tstart').onclick = toggleTimer;
  document.getElementById('treset').onclick = () => { stopTimer(); timer.left = timer.total; viewTonight(); };
  if (timer.running) tick();
  view.querySelectorAll('[data-mood]').forEach(b => b.onclick = () => {
    view.querySelectorAll('[data-mood]').forEach(x => x.setAttribute('aria-pressed', x===b));
    view.dataset.mood = b.dataset.mood;
  });
  view.dataset.mood = d.mood || '';
  document.getElementById('jsave').onclick = saveJournal;
  document.getElementById('jtrans').onclick = translateJournal;

  if (mv) mv.onclick = () => { if (pendingMove){ pendingMove = false; moveToYesterday(); } else { pendingMove = true; viewTonight(); } };
  bindEnCopy();
  view.querySelectorAll('[data-habit]').forEach(b => b.onclick = () => { toggleHabit(TODAY, b.dataset.habit); viewTonight(); });
  if (timer.running) runPhase(0);
}
function fmt(s){ return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }

let actx = null;
function chime(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [528, 792].forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, actx.currentTime + i*0.4);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + i*0.4 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i*0.4 + 3);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + i*0.4); o.stop(actx.currentTime + i*0.4 + 3.1);
    });
  }catch(e){}
}
function haptic(){
  // Android などは Vibration API、iPhone（iOS 18 以降）はスイッチ部品の触覚フィードバックを使う
  try { if (navigator.vibrate && navigator.vibrate([300,150,300,150,600])) return; } catch(e){}
  const l = document.getElementById('hap'); if (!l) return;
  [0,250,500,900,1150,1400].forEach(t => setTimeout(() => { try { l.click(); } catch(e){} }, t));
}
async function keepAwake(){
  try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch(e){ wake = null; }
}
function tick(){
  if (!timer.running) return;
  timer.left = Math.max(0, Math.ceil((timer.endAt - Date.now())/1000));
  const c = document.getElementById('clock'); if (c) c.textContent = fmt(timer.left);
  if (timer.left <= 0) finishTimer();
}
function startTicking(){
  clearInterval(timer.iv);
  timer.iv = setInterval(tick, 500);
  tick();
}
function iosTimerUrl(sec){
  return 'shortcuts://run-shortcut?name=' + encodeURIComponent('夜のノート瞑想') + '&input=text&text=' + Math.ceil(sec/60);
}
async function toggleTimer(){
  if (timer.running){
    timer.running = false; clearInterval(timer.iv); clearTimeout(timer.phaseT);
    try { wake && wake.release(); } catch(e){} wake = null;
    saveTimer(); viewTonight(); return;
  }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); } catch(e){}
  keepAwake();
  timer.running = true;
  timer.endAt = Date.now() + timer.left*1000;
  timer.startDay = TODAY;
  saveTimer();
  startTicking();
  document.getElementById('tstart').textContent = '一時停止';
  runPhase(0);
  if (S.settings.iosTimer) location.href = iosTimerUrl(timer.left);
}
function runPhase(i){
  clearTimeout(timer.phaseT);
  const orb = document.getElementById('orb'), lab = document.getElementById('blabel');
  if (!orb || !timer.running) return;
  const [name, sec, scale] = PHASES[i % PHASES.length];
  orb.style.transitionDuration = sec + 's';
  orb.style.transform = `scale(${scale})`;
  lab.textContent = name;
  timer.phaseT = setTimeout(() => runPhase(i+1), sec*1000);
}
function stopTimer(){
  timer.running = false; clearInterval(timer.iv); clearTimeout(timer.phaseT);
  try { wake && wake.release(); } catch(e){} wake = null;
  saveTimer();
}
function finishTimer(late){
  const mins = Math.round(timer.total/60), dayKey = timer.startDay || TODAY;
  stopTimer();
  if (!late){ chime(); haptic(); }
  day(dayKey).med = (day(dayKey).med || 0) + mins; save();
  timer.left = timer.total;
  toast(late ? `離れている間に${mins}分の瞑想が終わりました` : `${mins}分の瞑想を記録しました`);
  if (current === 'tonight') viewTonight();
}
function restoreTimer(){
  try {
    const t = JSON.parse(localStorage.getItem(TKEY) || 'null');
    if (!t || !t.endAt) return;
    timer.total = t.total; timer.endAt = t.endAt; timer.startDay = t.startDay; timer.running = true;
    if (Date.now() >= t.endAt) finishTimer(true);
    else { startTicking(); keepAwake(); if (current === 'tonight') viewTonight(); }
  } catch(e){}
}

const EN_LABEL = { good:'GOOD THING', learn:'LEARNING', next:'NEXT STEP' };
function enBlock(d){
  if (!d || !d.en) return '';
  const keys = ['good','learn','next'].filter(k => d.en[k]);
  if (!keys.length) return '';
  return `<div class="en"><dl>${keys.map(k=>`<div><dt>${EN_LABEL[k]}</dt><dd>${esc(d.en[k])}</dd></div>`).join('')}</dl>

function bindEnCopy(){

  b.onclick = async () => {
    const d = peek(TODAY); if (!d || !d.en) return;
    const txt = ['good','learn','next'].filter(k => d.en[k]).map(k => d.en[k]).join('\n');

async function toEnglish(text){
  const r = await fetch('https://api.mymemory.translated.net/get?langpair=ja|en&q=' + encodeURIComponent(text));
  if (!r.ok) throw new Error('http');
  const j = await r.json();
  const t = j && j.responseData && j.responseData.translatedText;
  if (!t || j.responseStatus != 200) throw new Error('bad');
  return t;
}
async function translateJournal(){
  const vals = {
    good: document.getElementById('j-good').value.trim(),
    learn: document.getElementById('j-learn').value.trim(),
    next: document.getElementById('j-next').value.trim()
  };
  const keys = Object.keys(vals).filter(k => vals[k]);

  const btn = document.getElementById('jtrans'); btn.disabled = true; btn.textContent = '変換中…';

    saveJournal(true);
    const d = day(TODAY); d.en = out;
    const l = S.learns.find(x => x.id === d.learnId); if (l) l.en = out.learn || '';
    save(); viewTonight(); toast('英語にしました');
  } catch(e){
    btn.disabled = false; btn.textContent = '英語にする';
    const all = keys.map(k => vals[k]).join('\n');

  }
}
let pendingMove = false;
function moveToYesterday(){
  const y = ymd(addDays(base(), -1));
  const d = day(TODAY), p = day(y);
  const join = (a,b) => [a,b].filter(Boolean).join('\n');
  if (p.journal){
    p.good = join(p.good, d.good); p.next = join(p.next, d.next); p.mood = p.mood || d.mood;
    if (d.learnId){ const l = S.learns.find(x => x.id === d.learnId); if (l) l.date = y; }
  } else {
    Object.assign(p, { mood:d.mood, good:d.good, next:d.next, en:d.en, journal:true, savedAt:d.savedAt });
    if (d.learnId){ p.learnId = d.learnId; const l = S.learns.find(x => x.id === d.learnId); if (l) l.date = y; }
  }
  Object.assign(d, { mood:0, good:'', next:'', journal:false }); delete d.en; delete d.learnId; delete d.savedAt;
  save(); toast('昨日の分に移しました。今日の分を書けます'); viewTonight();
}
function saveJournal(silent){
  const d = day(TODAY);
  d.mood = +view.dataset.mood || 0;
  d.good = document.getElementById('j-good').value.trim();
  d.next = document.getElementById('j-next').value.trim();
  const lt = document.getElementById('j-learn').value.trim();
  if (lt){
    let l = S.learns.find(x => x.id === d.learnId);
    if (l) l.text = lt; else { l = {id:'l'+Date.now(), date:TODAY, text:lt}; S.learns.push(l); d.learnId = l.id; }
  } else if (d.learnId){ S.learns = S.learns.filter(x => x.id !== d.learnId); delete d.learnId; }
  d.journal = !!(d.mood || d.good || d.next || lt);
  d.savedAt = Date.now();
  save();
  if (silent === true) return;
  toast('ふりかえりを保存しました'); viewTonight();
}

    S.settings.resetHour = RESET = +e.target.value; save(); refreshDay(); header(); toast(`切り替え時刻を${RESET}:00にしました`);
  };
  document.getElementById('ios-timer').onchange = e => { S.settings.iosTimer = e.target.checked; save(); };
  document.getElementById('theme').onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem(KEY+'-theme', next); } catch(e){}
    viewLife();
  };
}
function themeLabel(){ const t = document.documentElement.dataset.theme; return t==='dark'?'夜':t==='light'?'昼':'自動'; }

/* ---------- router ---------- */
let current = 'tonight';
const VIEWS = { tonight:viewTonight, habits:viewHabits, learn:viewLearn, life:viewLife };
function go(tab){
  current = tab; pendingDelete = null; pendingMove = false;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab===tab ? 'page' : 'false'));
  VIEWS[tab](); window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => go(t.dataset.tab));
document.getElementById('clear-sample').onclick = () => {
  S = { habits:S.habits, days:{}, learns:[], sample:false, settings:S.settings }; save(); header(); go(current); toast('サンプルを消しました');
};
try { const t = localStorage.getItem(KEY+'-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
header();
const hash = location.hash.slice(1);
go(VIEWS[hash] ? hash : 'tonight');
restoreTimer();
function onReturn(){
  if (document.visibilityState !== 'visible') return;
  if (refreshDay()){ header(); go(current); toast('新しい日になりました'); }
  if (timer.running){ tick(); keepAwake(); }
}
document.addEventListener('visibilitychange', onReturn);
window.addEventListener('pageshow', onReturn);
window.addEventListener('focus', onReturn);
setInterval(() => { const a = document.activeElement; if (a && /TEXTAREA|INPUT/.test(a.tagName)) return; if (refreshDay()){ header(); go(current); } }, 60000);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h]) go(h); });
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>

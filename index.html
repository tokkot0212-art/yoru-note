<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日々のノート</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日々のノート">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app, night-desk feel — ink-blue ground, a single lamp-amber accent, bottom tab bar */
:root{
  --bg:#0f1524; --surface:#172036; --surface2:#1f2a44; --line:#2a3654;
  --fg:#e7e9f0; --muted:#8f9bb8; --accent:#e8b86a; --accent-ink:#1a1408;
  --moon:#a8bbeb; --good:#7cc4a4; --bad:#e8857a; --heat0:#1c2640;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e4e9f2; --line:#d3dae6;
  --fg:#1a2236; --muted:#5d6a85; --accent:#a86d14; --accent-ink:#ffffff;
  --moon:#4a63a8; --good:#2f8a63; --bad:#c2473b; --heat0:#e1e6ef; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e4e9f2; --line:#d3dae6;
  --fg:#1a2236; --muted:#5d6a85; --accent:#a86d14; --accent-ink:#ffffff;
  --moon:#4a63a8; --good:#2f8a63; --bad:#c2473b; --heat0:#e1e6ef; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.65rem;letter-spacing:.02em}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-family:var(--mono)}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.moon{width:38px;height:38px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 65% 35%,transparent 44%,var(--moon) 45%);opacity:.9}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.82rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:baseline;gap:10px}
.step .n{font-family:var(--mono);font-size:.78rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;flex:none}
.done-tag{margin-left:auto;font-size:.75rem;color:var(--good);flex:none}

button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* breathing */
.breath{display:grid;place-items:center;height:220px;position:relative}
.ring{position:absolute;width:190px;height:190px;border-radius:50%;border:1px solid var(--line)}
.orb{width:86px;height:86px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--accent) 85%,white),color-mix(in srgb,var(--accent) 35%,transparent) 70%);
  transform:scale(1);transition-property:transform;transition-timing-function:ease-in-out}
.mantra{font-family:var(--display);font-size:1rem;line-height:1.6;color:var(--muted);text-align:center;min-height:3.2em;margin:-4px 0 0;padding-inline:8px;text-wrap:balance;opacity:.85}
.mantra.in{animation:mfade 1.2s ease}
@keyframes mfade{from{opacity:0;transform:translateY(4px)}to{opacity:.85;transform:none}}
details.mset{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column}
details.mset summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding-block:6px;font-weight:500;font-size:.9rem}
details.mset summary::-webkit-details-marker{display:none}
details.mset[open] summary{margin-bottom:6px}
details.mset > *:not(summary){margin-bottom:8px}
.mcat{display:flex;flex-direction:column;padding-top:8px}
.mcat-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:4px}
.mcat-h b{font-size:.9rem;color:var(--accent)}
.mcat-h .linkbtn{margin-left:auto}
.mlist{display:flex;flex-direction:column}
.mitem{display:flex;align-items:center;gap:8px;padding-block:6px;border-top:1px solid var(--line)}
.mitem label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-size:.9rem}
.mitem input{width:18px;height:18px;accent-color:var(--good);flex:none}
.breath-label{position:absolute;bottom:6px;font-size:.9rem;color:var(--muted)}
.clock{font-family:var(--mono);font-size:2.4rem;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em}

label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500}
textarea,input[type=text],input[type=search]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:64px;resize:vertical}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood .chip{padding:6px 2px;font-size:.75rem;text-align:center;border-radius:10px}

.habit{display:flex;align-items:center;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;flex:none;padding:0}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"]::after{content:"";width:10px;height:6px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.habit .name{flex:1;min-width:0}
.dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--heat0);border:0;padding:0}
.dot.on{background:var(--good)}
.hblock{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.hblock:first-child{border-top:0;padding-top:0}
.hhead{display:flex;align-items:baseline;gap:10px}
.hhead .name{flex:1;min-width:0;font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--heat0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 0;
  font-family:var(--mono);line-height:1.2;color:var(--muted);touch-action:manipulation;transition:transform .1s}
.cell .w{font-size:.66rem}
.cell .n{font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--fg)}
.cell.on{background:var(--good);border-color:var(--good);color:var(--bg)}
.cell.on .n{color:var(--bg);font-weight:500}
.cell.today{border-color:var(--accent)}
.cell.on.today{box-shadow:0 0 0 2px var(--accent)}
.cell:active{transform:scale(.94)}
.cell.ro:active{transform:none}
.cell.ro{cursor:default}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.qh{display:flex;align-items:center;gap:10px}
.qh h3{font-size:.98rem}
.qn{font-family:var(--mono);font-size:.72rem;color:var(--accent);width:22px;height:22px;border-radius:6px;border:1px solid var(--accent);display:grid;place-items:center;flex:none}
.hint{font-size:.8rem;color:var(--muted);line-height:1.55}
.feels{display:flex;flex-wrap:wrap;gap:6px}
.chip.sm{font-size:.8rem;padding:4px 10px}
.three{display:flex;flex-direction:column;gap:6px}
.tline{display:flex;align-items:center;gap:8px}
.tline input{min-width:0}
.tline .mono{color:var(--muted);font-size:.8rem;width:1em;text-align:center;flex:none}
.f.sub{font-size:.8rem;font-weight:400;color:var(--muted)}
.ifthen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:380px){.ifthen{grid-template-columns:1fr}}
.plan-preview{font-family:var(--display);font-size:1rem;color:var(--accent);min-height:1.4em}
.prompt{font-family:var(--display);font-size:1rem;line-height:1.6}
details.more{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:0}
details.more summary{cursor:pointer;font-weight:500;color:var(--muted);font-size:.9rem;list-style:none;padding-block:4px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'＋ '}
details.more[open] summary::before{content:'－ '}
details.more[open] summary{margin-bottom:6px}
textarea.fade{opacity:0;transition:opacity .6s}
.feelbar{display:flex;flex-wrap:wrap;gap:8px}
.feelbar span{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.feelbar b{font-family:var(--mono);font-weight:500;color:var(--accent);margin-left:4px}
.wtask{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.whenrow{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.whenrow input{flex:1;min-width:0;padding:7px 10px}
.cell.mk.o{background:var(--good);border-color:var(--good)}
.cell.mk.o .n,.cell.mk.o .w{color:var(--bg)}
.cell.mk.t{background:var(--accent);border-color:var(--accent)}
.cell.mk.t .n,.cell.mk.t .w{color:var(--accent-ink);font-weight:500}
.cell.mk.x{background:var(--bad);border-color:var(--bad)}
.cell.mk.x .n,.cell.mk.x .w{color:var(--bg);font-weight:500}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px;border:1px dashed var(--line);border-radius:12px;font-size:.88rem;color:var(--muted)}
details.catg{border-top:1px solid var(--line)}
details.catg summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding-block:10px;font-weight:500}
details.catg summary::-webkit-details-marker{display:none}
.pick{display:flex;align-items:center;gap:8px;padding-block:6px}
.pick .name,.kbtext{flex:1;min-width:0;font-size:.9rem}
.star{background:none;border:0;padding:4px;font-size:1.05rem;color:var(--accent);line-height:1;flex:none}
.chip.sm[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.wwhen{display:block;font-size:.76rem;color:var(--muted)}
.ox{display:flex;gap:6px;flex:none}
.oxb{width:40px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:1.05rem;color:var(--muted)}
.oxb.on.o{background:var(--good);border-color:var(--good);color:var(--bg)}
.oxb.on.t{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.oxb.on.x{background:var(--bad);border-color:var(--bad);color:var(--bg);font-weight:700}
.oxb.on{transform:scale(1.06)}
.ox:has(.on) .oxb:not(.on){opacity:.45}
.ox .oxb{width:38px}
.kbhead{display:flex;flex-direction:column;gap:4px;padding-bottom:8px}
.kbverb{font-family:var(--body);font-size:.72rem;font-weight:700;margin-left:8px;padding:2px 8px;border-radius:999px;vertical-align:middle;background:var(--surface2);color:var(--accent)}
.kbitem{display:flex;align-items:center;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.kbtext{display:flex;flex-direction:column;gap:2px}
.kbtext b{font-weight:700}
.kbtext span{font-size:.82rem;color:var(--muted);line-height:1.5}
.kbitem .chip{flex:none;line-height:1.25;font-size:.72rem;text-align:center}
.ftag{font-size:.7rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-right:6px;vertical-align:1px}
.advice{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.advice .eyebrow{color:var(--accent)}
.adv-text{font-family:var(--display);font-size:1.05rem;line-height:1.6}
.seg{display:inline-flex;margin-top:6px;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 12px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.step h2{white-space:nowrap}
.oxb{font-size:1.1rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.bset{display:flex;flex-direction:column;gap:10px}
.chip.sm .mono{font-size:.72rem;opacity:.75}
.steppers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stp{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;justify-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 4px}
.stp span{grid-column:1/-1;font-size:.74rem;color:var(--muted)}
.stp button{width:26px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:1rem;padding:0}
.stp b{font-size:1.1rem;font-weight:500;white-space:nowrap}
.stp b small{font-size:.65rem;color:var(--muted);margin-left:1px}
button:disabled{opacity:.45;cursor:default}
.wander{display:flex;gap:8px;justify-content:center;align-items:center}
.wbtn{display:flex;align-items:center;gap:10px;padding:12px 18px}
.wbtn b{font-size:1.2rem;color:var(--accent)}
.sess.edit{align-items:center}
.wedit{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.wedit button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);padding:0;font-size:.9rem}
.wedit b{min-width:1.2em;text-align:center;color:var(--fg)}
.wedit.big button{width:34px;height:34px;font-size:1.05rem}
.wedit.big b{font-size:1.15rem;min-width:1.8em}
.wrow{border-top:1px dashed var(--line)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:8px 10px}
.stats3 .k{font-size:.72rem;color:var(--muted)}
.stats3 b{font-size:1.2rem;font-weight:500}
.dnote{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--good) 14%,transparent);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.dnote b{color:var(--good)}
.dnote span{font-size:.84rem}
.dstatus{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;padding-block:6px}
.dstatus span{color:var(--muted)}
.dstatus.warn b{color:var(--accent)}
.dsum{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.dsum li{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;padding-block:4px;border-bottom:1px solid var(--line)}
.dsum li span{color:var(--muted)}
.dsum li:first-child{grid-column:1/-1}
.dsum li *{white-space:nowrap}
.dstep{display:flex;gap:10px;align-items:flex-start;padding-top:14px;border-top:1px solid var(--line)}
.dstep h3{font-size:.98rem;margin-bottom:2px}
.dcol{display:flex;flex-direction:column;gap:8px}
.dconfirm{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--accent);background:var(--bg)}
.panel.editing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wkstate{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;font-size:.84rem}
.wkstate span{color:var(--muted)}
.wkstate.edit{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.wkstate.edit b{color:var(--accent)}
.wkstate.done{background:color-mix(in srgb,var(--good) 14%,transparent)}
.wkstate.done b{color:var(--good)}
.wkstate.none{background:var(--bg);border:1px dashed var(--line)}
.simple .opt{display:none}
.bsum{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.bsum b{color:var(--fg);font-weight:500}
.setblock{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.setblock > span{font-size:.9rem}
.sesslist{display:flex;flex-direction:column;gap:4px}
.sess{display:grid;grid-template-columns:3.2em 1.6em 3em 4em 1fr;gap:6px;font-size:.82rem;color:var(--muted);padding-block:4px;border-top:1px solid var(--line)}
.sess b{color:var(--fg)}
.mtab{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:1.4fr .7fr .9fr 1.1fr;gap:6px;padding-block:7px;border-top:1px solid var(--line);font-size:.86rem}
.mrow span:not(:first-child){text-align:right}
.mrow.mh{font-size:.72rem;color:var(--muted);border-top:0}
.en{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.en dl{margin:0;display:flex;flex-direction:column;gap:8px}
.en dt{font-size:.74rem;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}
.en dd{margin:0;font-size:.95rem;line-height:1.55}
.learn .en-line{font-size:.85rem;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 0;font-size:.78rem;color:var(--muted);flex:none}
.streak{font-family:var(--mono);font-size:.78rem;color:var(--accent);min-width:3.2em;text-align:right}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .v{font-family:var(--mono);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:.8rem;color:var(--muted);margin-left:2px}
.stat .k{font-size:.78rem;color:var(--muted)}

.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(16px,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--heat0);display:block}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--heat0))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 62%,var(--heat0))}
.heat i.l3{background:var(--accent)}
.heat i.fut{background:transparent}
.heat i.today{outline:1.5px solid var(--fg);outline-offset:1px}

<script>
const KEY = 'yoru-note-v1';
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
let RESET = 2; // 1日の切り替え時刻（時）
function base(){ const d = new Date(Date.now() - RESET*3600e3); d.setHours(12,0,0,0); return d; }
let TODAY = ymd(base());
function refreshDay(){ const t = ymd(base()); if (t !== TODAY){ TODAY = t; return true; } return false; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','月','火','水','木','金','土'];
const MOODS = ['ぐったり','いまいち','ふつう','まずまず','いい日'];

/* ---------- data ---------- */
const BASE_HABITS = [ {id:'b-meal', name:'食事'}, {id:'b-sleep', name:'睡眠'}, {id:'b-move', name:'運動'}, {id:'b-focus', name:'OBL'} ];
function seed(){
  let r = 7; const rnd = () => (r = (r*16807) % 2147483647) / 2147483647;
  const habits = BASE_HABITS.map(h => ({...h}));
  const goods = ['企画書が一発で通った','後輩に感謝された','定時で上がれた','昼に散歩できた','難しい商談をまとめられた','家族と夕飯を食べた','会議を15分早く終えられた'];
  const learnsText = [
    '会議の冒頭でゴールを一行で共有すると脱線しない',
    'ピボットテーブルで月次集計が5分になった',
    '断るときは代案をひとつ添えると角が立たない',
    '「circle back」は後で改めて話す、という意味',
    '寝る前のスマホを15分減らすと寝つきが良い',
    '1on1は相手に7割話してもらうと本音が出る',
    '資料は結論→理由→次のアクションの順で書く',
    'ポモドーロ25分×4で午前中に資料が完成した',
    '数字は前年比と目標比の両方で見る',
    '疲れた日は「完璧より完了」で切り上げる',
    'メールの件名に期限を入れると返信が早い',
    '怒りは6秒待つと言葉を選べる'
  ];
  const nexts = ['朝イチで見積を送る','10時の会議の論点を3つ書く','部長に進捗を一言報告','早めに寝る','経費精算を終わらせる'];
  const days = {}, learns = [];
  for (let i = 45; i >= 1; i--){
    if (rnd() < 0.24) continue;
    const date = ymd(addDays(base(), -i));
    const d = { med:[3,5,5,10,0][Math.floor(rnd()*5)], mood: 2+Math.floor(rnd()*3.6), good:'', next:'', habits:[] };
    if (rnd() < 0.85){ d.good = goods[Math.floor(rnd()*goods.length)]; d.next = nexts[Math.floor(rnd()*nexts.length)]; d.journal = true; }
    if (d.journal){ const fs = ['充実','疲れた','安心','焦り','感謝','穏やか','不安','うれしい']; d.feels = [fs[Math.floor(rnd()*8)], fs[Math.floor(rnd()*8)]].filter((x,i,a)=>a.indexOf(x)===i); }
    habits.forEach(h => { if (rnd() < 0.62) d.habits.push(h.id); });
    if (d.journal && rnd() < 0.5 && learns.length < learnsText.length){
      const id = 'l'+i; learns.push({id, date, text: learnsText[learns.length]}); d.learnId = id;
    }
    days[date] = d;
  }
  return { habits, days, learns, sample:true };
}
function load(){ try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e){} return seed(); }
let S = load();
S.habits = (S.habits || []).map(h => h.id === 'b-focus' && h.name === '集中すること' ? {...h, name:'OBL'} : h);
if (!S.baseHabits){
  const cur = S.habits || [];
  const base = BASE_HABITS.map(b => cur.find(h => h.id === b.id || h.name === b.name) || {...b});
  S.habits = base.concat(cur.filter(h => !base.includes(h)));
  S.baseHabits = 1;
}
S.settings = Object.assign({ resetHour:2, iosTimer:false, simple:true }, S.settings);
RESET = S.settings.resetHour; TODAY = ymd(base());
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const day = date => S.days[date] || (S.days[date] = { med:0, mood:0, good:'', next:'', habits:[] });
const peek = date => S.days[date];
const active = d => d && (d.med > 0 || d.journal || (d.habits && d.habits.length));

function streakOf(test){
  let n = 0, cur = base();
  if (!test(peek(ymd(cur)))) cur = addDays(cur,-1);
  while (test(peek(ymd(cur)))){ n++; cur = addDays(cur,-1); }
  return n;
}

/* ---------- ui helpers ---------- */
const view = document.getElementById('view');
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1800); }
function header(){
  const now = base();
  document.getElementById('today-label').textContent = `${now.getMonth()+1}月${now.getDate()}日 (${WD[now.getDay()]})`;
  const h = new Date().getHours();
  document.getElementById('greet').textContent = h >= 18 || h < 4 ? '今日もおつかれさまでした' : h < 11 ? 'おはようございます' : 'ひと息ついて、整えましょう';
  document.getElementById('sample-banner').hidden = !S.sample;
}

/* ---------- tonight ---------- */
const TKEY = KEY + '-timer';
let timer = { total:300, left:300, running:false, endAt:0, startDay:'', iv:null, phaseT:null };
const BREATH_PRESETS = [ {name:'いつもの', i:4, h:2, e:6}, {name:'4-7-8', i:4, h:7, e:8}, {name:'ボックス', i:4, h:4, e:4}, {name:'ゆっくり', i:5, h:0, e:5} ];
const SLOTS = [['morning','朝'],['noon','昼'],['night','夜']];
function breath(){ return S.settings.breath || (S.settings.breath = { i:4, h:2, e:6 }); }
function phases(){ const b = breath(); return [['吸って', b.i, 1.75], ['止めて', b.h, 1.75], ['吐いて', b.e, 1]].filter(p => p[1] > 0); }
function autoSlot(){ const h = new Date().getHours(); return h >= 4 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'noon' : 'night'; }
const patLabel = b => `${b.i}-${b.h}-${b.e}`;
let medSlot = null;
let wake = null;
function saveTimer(){
  try {
    if (timer.running) localStorage.setItem(TKEY, JSON.stringify({ total:timer.total, endAt:timer.endAt, startDay:timer.startDay, wander:timer.wander||0, slot:timer.slot, pat:timer.pat }));
    else localStorage.removeItem(TKEY);
  } catch(e){}
}

function viewTonight(){
  const d = peek(TODAY) || {};
  const doneMed = d.med > 0, doneJ = !!d.journal;
  view.innerHTML = `
  <div class="${isSimple()?'simple':''}" style="display:flex;flex-direction:column;gap:16px">
    ${!isSimple() || [0,6].includes(base().getDay()) ? advicePanel() : ''}
    <section class="panel" aria-labelledby="s1">
      <div class="step"><span class="n">1</span><h2 id="s1">セルフコンパッション</h2>${doneMed?`<span class="done-tag">今日 ${d.med}分 済み</span>`:''}</div>
      ${isSimple() && !bsetOpen ? breathSummary() : breathSettings() + (isSimple() ? '<button class="linkbtn" id="bs-close" style="align-self:flex-start">設定を閉じる</button>' : '')}
      <div class="row" role="group" aria-label="時間">
        ${[1,3,5,10,15].map(m=>`<button class="chip" data-min="${m}" aria-pressed="${timer.total===m*60}">${m}分</button>`).join('')}
      </div>
      <div class="breath"><div class="ring"></div><div class="orb" id="orb"></div><div class="breath-label" id="blabel">準備ができたら開始</div></div>
      ${S.settings.mantraOn !== false && activeMantras().length ? `<p class="mantra" id="mantra" aria-live="polite">${timer.running ? '' : esc(activeMantras()[0].text)}</p>` : ''}
      <div class="clock" id="clock">${fmt(timer.left)}</div>
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="tstart">${timer.running?'一時停止':'開始'}</button>
        <button class="btn ghost" id="treset">リセット</button>
      </div>
      <div class="wander">
        <button class="btn wbtn" id="wplus" ${timer.running?'':'disabled'}>呼吸に戻った<b class="mono" id="wcount">${timer.wander||0}</b></button>
        <button class="btn ghost small" id="wminus" ${timer.running && timer.wander?'':'disabled'} aria-label="1回減らす">−1</button>
      </div>
      <p class="muted small opt" style="text-align:center">考えごとに気づいて呼吸に戻ったら、1回押します。押すのが気になるときは、終わってから下の一覧で回数を入れても大丈夫です。</p>
      ${todaySessions(d)}
    </section>

    <section class="panel" aria-labelledby="s2">
      <div class="step"><span class="n">2</span><h2 id="s2">ジャーナリング</h2>${doneJ?'<span class="done-tag">保存済み</span>':''}</div>
      <span class="small muted">今日の調子</span>
      <div class="mood" role="group" aria-label="今日の調子">
        ${MOODS.map((m,i)=>`<button class="chip" data-mood="${i+1}" aria-pressed="${d.mood===i+1}">${m}</button>`).join('')}
      </div>
      <label class="f">今日やったこと・わかったこと<textarea id="j-did" placeholder="例：見積の進め方を部長に相談した。先に結論を言うと話が早い">${esc(learnText(d.learnId) || d.did)}</textarea></label>
      <label class="f">失敗して学んだこと<textarea id="j-fail" placeholder="例：確認を後回しにして手戻り。送る前に数字だけは見直す">${esc(learnText(d.failId))}</textarea></label>
      <label class="f">やりたかったけど、できなかったこと<textarea id="j-undone" placeholder="例：英語の勉強。帰りが遅くなった">${esc(d.undone)}</textarea></label>
      <label class="f">次の一歩<input type="text" id="j-next" placeholder="例：朝、席に着いたら最初に見積を送る" value="${esc(d.next)}"></label>
      <div class="row">
        <button class="btn primary" id="jsave" style="flex:1">ジャーナリングを保存</button>
        <button class="btn" id="jtrans">英語にする</button>
      </div>
      <div id="en-box">${enBlock(d)}</div>
      ${doneJ?`<button class="linkbtn" id="jmove" style="align-self:flex-start">${pendingMove?'もう一度押すと、昨日の分に移して空欄にします':'これは昨日の記入？ → 昨日の分に移して新しく書く'}</button>`:''}
    </section>

    <section class="panel" aria-labelledby="s3">
      <div class="step"><span class="n">3</span><h2 id="s3">成長トラッキング</h2>
        <div class="seg" role="group" aria-label="評価する日" style="margin:0 0 0 auto"><button data-td="today" aria-pressed="${trackDay==='today'}">今日</button><button data-td="yday" aria-pressed="${trackDay==='yday'}">昨日</button></div></div>
      <p class="hint">${trackDay==='yday' ? '<b style="color:var(--accent)">昨日の分をつけています。</b>' : ''}○できた　△少しできた　×できなかった<span class="opt">。評価はここでつけ、「習慣」タブでは結果を見られます</span></p>
      <div>${S.habits.map(h=>`
        <div class="habit">
          <span class="name">${esc(h.name)}<span class="wwhen">${habitStreak(h.id)}日連続</span></span>
          ${oxButtons('data-habit', h.id, habitMark(trackDate(), h.id))}
        </div>`).join('') || '<p class="muted small">習慣タブで追加できます。</p>'}</div>
      ${wanderRow()}
      <h3 style="font-size:.95rem;margin-top:6px">ウィークリータスク</h3>
      <div>${todayWeeklyRows()}</div>
    </section>
  </div>`;

  view.querySelectorAll('[data-min]').forEach(b => b.onclick = () => { if (timer.running) return; timer.total = timer.left = +b.dataset.min*60; viewTonight(); });
  document.getElementById('tstart').onclick = toggleTimer;
  bindBreath();
  bindMantra();
  const bo = document.getElementById('bs-open'); if (bo) bo.onclick = () => { bsetOpen = true; viewTonight(); };
  const bc = document.getElementById('bs-close'); if (bc) bc.onclick = () => { bsetOpen = false; viewTonight(); };
  const ag = document.getElementById('adv-go'); if (ag) ag.onclick = () => adviceAction && adviceAction();
  document.getElementById('treset').onclick = () => { stopTimer(); timer.left = timer.total; timer.wander = 0; timer.endAt = 0; viewTonight(); };
  if (timer.running) tick();
  view.querySelectorAll('[data-mood]').forEach(b => b.onclick = () => {
    view.querySelectorAll('[data-mood]').forEach(x => x.setAttribute('aria-pressed', x===b));
    view.dataset.mood = b.dataset.mood;
  });
  view.dataset.mood = d.mood || '';
  document.getElementById('jsave').onclick = saveJournal;
  document.getElementById('jtrans').onclick = translateJournal;
  const mv = document.getElementById('jmove');
  if (mv) mv.onclick = () => { if (pendingMove){ pendingMove = false; moveToYesterday(); } else { pendingMove = true; viewTonight(); } };
  bindEnCopy();
  view.querySelectorAll('[data-habit]').forEach(b => b.onclick = () => { const id = b.dataset.habit, v = b.dataset.v, dt = trackDate(); setHabitMark(dt, id, habitMark(dt, id) === v ? '' : v); viewTonight(); });
  view.querySelectorAll('[data-td]').forEach(b => b.onclick = () => { trackDay = b.dataset.td; viewTonight(); });
  bindTodayWeekly();
  view.querySelectorAll('[data-dw]').forEach(b => b.onclick = () => { adjustDayWander(trackDate(), +b.dataset.dw); viewTonight(); });
  if (timer.running) runPhase(0);
}
function fmt(s){ return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }
const DEFAULT_MANTRAS = [
  '安心していられますように',
  '心がおだやかでありますように',
  '自分にやさしくいられますように',
  'ありのままの自分を受け入れられますように',
  'いま、つらさを感じている',
  'つらさは、誰にでもあるもの',
  'いまの自分に、思いやりを向けよう',
  '変えられないことは、受け入れる',
  '変えられることは、変えていく',
  'その違いを、見きわめられますように'
];
const MANTRA_CATS = [
  { key:'kind',   name:'やさしさ',   lead:'自分に慈しみを向ける言葉' },
  { key:'hard',   name:'つらいとき', lead:'うまくいかないときに唱える言葉' },
  { key:'accept', name:'受け入れる', lead:'変えられることと変えられないことを見分ける言葉' },
  { key:'own',    name:'自分の言葉', lead:'本や自分で見つけた言葉' }
];
const defaultCat = i => i < 4 ? 'kind' : i < 7 ? 'hard' : 'accept';
function mantras(){
  if (!S.mantras) S.mantras = DEFAULT_MANTRAS.map((t,i) => ({ id:'m'+i, text:t, on: i < 4, cat: defaultCat(i) }));
  S.mantras.forEach(m => { if (!m.cat){ const n = /^m(\d)$/.exec(m.id); m.cat = n ? defaultCat(+n[1]) : 'own'; } });
  return S.mantras;
}
let mantraNewCat = 'own';
function activeMantras(){ return mantras().filter(m => m.on); }
let mantraIdx = -1, mantraEdit = false;
function nextMantra(){
  const a = activeMantras(); if (!a.length) return '';
  if (S.settings.mantraOrder === 'rand' && a.length > 1){ let j; do { j = Math.floor(Math.random()*a.length); } while (j === mantraIdx); mantraIdx = j; }
  else mantraIdx = (mantraIdx + 1) % a.length;
  return a[mantraIdx].text;
}
function showMantra(text){
  const el = document.getElementById('mantra'); if (!el) return;
  el.classList.remove('in'); void el.offsetWidth; el.textContent = text; if (text) el.classList.add('in');
}
function mantraSettings(){
  const ms = mantras(), on = S.settings.mantraOn !== false, n = ms.filter(m => m.on).length;
  return `<details class="mset" ${mantraEdit?'open':''} id="mset">
    <summary><span>マントラ</span><span class="small muted">${on ? `${[...new Set(ms.filter(m => m.on).map(m => MANTRA_CATS.find(c => c.key === m.cat).name))].join('・') || 'なし'}・${n}個` : 'オフ'}</span></summary>
    <div class="setrow"><label for="mt-on">瞑想中にマントラを表示</label><input type="checkbox" id="mt-on" switch ${on?'checked':''}></div>
    <div class="setrow"><span class="small">順番</span><div class="seg" role="group" aria-label="順番"><button data-mo="seq" aria-pressed="${S.settings.mantraOrder!=='rand'}">上から順に</button><button data-mo="rand" aria-pressed="${S.settings.mantraOrder==='rand'}">ランダム</button></div></div>
    <p class="hint">使う言葉にチェックを入れます。吸い始めるたびに、次の言葉に切り替わります。カテゴリー名のボタンで、そのカテゴリーだけを使うように一度に切り替えられます。</p>
    <div class="row" role="group" aria-label="カテゴリーで選ぶ">${MANTRA_CATS.map(c => { const items = ms.filter(m => m.cat === c.key), onN = items.filter(m => m.on).length; return items.length ? `<button class="chip sm" data-mcat="${c.key}" aria-pressed="${onN === items.length && onN === n}">${c.name}だけ</button>` : ''; }).join('')}</div>

let actx = null;
function chime(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [528, 792].forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, actx.currentTime + i*0.4);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + i*0.4 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i*0.4 + 3);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + i*0.4); o.stop(actx.currentTime + i*0.4 + 3.1);
    });
  }catch(e){}
}
function haptic(){
  // Android などは Vibration API、iPhone（iOS 18 以降）はスイッチ部品の触覚フィードバックを使う
  try { if (navigator.vibrate && navigator.vibrate([300,150,300,150,600])) return; } catch(e){}

}

async function toggleTimer(){

  orb.style.transitionDuration = sec + 's';

/* ---------- habits ---------- */
function habitMark(date, id){
  const d = peek(date); if (!d) return '';
  if (d.hm && d.hm[id]) return d.hm[id];
  return (d.habits || []).includes(id) ? 'o' : '';
}
function setHabitMark(date, id, v){
  const d = day(date);
  if (!d.hm){ d.hm = {}; (d.habits || []).forEach(h => d.hm[h] = 'o'); }
  if (v) d.hm[id] = v; else delete d.hm[id];
  d.habits = Object.keys(d.hm).filter(k => d.hm[k] === 'o' || d.hm[k] === 't');
  save();
}

function dayWander(d){ if (!d) return null; const ss = d.sessions || []; if (!ss.length && d.wanderExtra == null) return null; return ss.reduce((a,x) => a + x.wander, 0) + (d.wanderExtra || 0); }
function dayMedMin(d){ return d ? (d.sessions || []).reduce((a,x) => a + x.min, 0) : 0; }
function adjustDayWander(date, dv){
  const d = day(date), ss = d.sessions || [];
  if (dv > 0) d.wanderExtra = (d.wanderExtra || 0) + 1;
  else if (d.wanderExtra > 0) d.wanderExtra--;
  else { const last = [...ss].reverse().find(x => x.wander > 0); if (last) last.wander--; else if (!ss.length) d.wanderExtra = 0; }
  save();
}
function wanderRow(){

  const avg = week.length ? (week.reduce((a,x) => a + x, 0) / week.length).toFixed(1) : '−';
  return `<div class="habit wrow">
    <span class="name">戻りの回数<span class="wwhen">直近7日の平均 ${avg}回</span></span>
    <span class="wedit big"><button data-dw="-1" aria-label="1回減らす">−</button><b class="mono">${v == null ? '−' : v}</b><button data-dw="1" aria-label="1回増やす">＋</button></span>
  </div>`;
}
let wyMode = 'count';
function wanderYearPanel(){
  const end = weekStart(base()), weeks = [];
  for (let i = 51; i >= 0; i--){
    const ws = addDays(end, -7*i); let sum = 0, days = 0, min = 0;
    for (let j = 0; j < 7; j++){ const d = peek(ymd(addDays(ws, j))), v = dayWander(d); if (v != null){ sum += v; days++; min += dayMedMin(d); } }
    weeks.push({ ws, v: days ? (wyMode === 'count' ? sum / days : (min ? sum / min * 10 : null)) : null });
  }
  const has = weeks.filter(w => w.v != null);
  const head = `<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>戻りの回数（1年）</h3><span class="small muted">週ごとの平均</span></div>

  if (!has.length) return `<section class="panel">${head}<p class="muted small">瞑想で戻りの回数を記録すると、ここに1年分の変化が週ごとに並びます。</p></section>`;
  const W = 320, H = 130, L = 26, B = 20, T = 10, bw = (W - L - 4) / 52;
  const top = Math.max(4, Math.ceil(Math.max(...has.map(w => w.v)) / 2) * 2);

  const bars = weeks.map((w,i) => w.v == null ? '' : `<rect x="${(L + i*bw + 1).toFixed(1)}" y="${Y(w.v).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(H - B - Y(w.v)).toFixed(1)}" rx="1.5" fill="${i === 51 ? 'var(--accent)' : 'var(--moon)'}"><title>${ymd(w.ws).slice(5).replace('-','/')}の週 ${w.v.toFixed(1)}</title></rect>`).join('');
  const ticks = [0, top/2, top].map(v => `<text x="0" y="${Y(v)+3}">${v}</text><line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/>`).join('');
  let months = '', lastM = weeks[0].ws.getMonth(), lastX = -99;
  weeks.forEach((w,i) => { const m = w.ws.getMonth(), x = L + i*bw; if (m !== lastM){ lastM = m; if (x - lastX >= 40 && i < 50){ months += `<text x="${x.toFixed(1)}" y="${H-4}">${m+1}月</text>`; lastX = x; } } });
  const avg = a => { const x = a.filter(w => w.v != null); return x.length ? x.reduce((s,w) => s + w.v, 0) / x.length : null; };
  const f = v => v == null ? '−' : v.toFixed(1);
  const r4 = avg(weeks.slice(-4)), p4 = avg(weeks.slice(-8,-4)), y = avg(weeks);
  const firstLog = has[0];
  return `<section class="panel">${head}
    <svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="過去52週の戻りの回数の推移">${ticks}${bars}${months}</svg>
    <div class="stats3"><div><span class="k">直近4週</span><b class="mono">${f(r4)}</b></div><div><span class="k">その前の4週</span><b class="mono">${f(p4)}</b></div><div><span class="k">1年の平均</span><b class="mono">${f(y)}</b></div></div>
    <p class="hint">${ymd(firstLog.ws).replace(/-/g,'/')}の週から記録があります。週ごとの上下より、数か月単位の流れを見てください。</p>
  </section>`;
}

  if (pts.length < 2) return '';
  const W = 300, H = 110, L = 26, B = 18, T = 8;
  const vals = pts.map(x => x.wander), max = Math.max(4, ...vals);
  const top = Math.ceil(max / 2) * 2;
  const X = i => L + i * (W - L - 8) / (pts.length - 1), Y = v => T + (1 - v / top) * (H - T - B);
  const path = vals.map((v,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const ticks = [0, top/2, top].map(v => `<text x="0" y="${Y(v)+3}">${v}</text><line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/>`).join('');
  const avg = a => a.length ? a.reduce((s,x) => s + x, 0) / a.length : 0;
  const half = Math.floor(vals.length / 2), first = avg(vals.slice(0, half)), last = avg(vals.slice(half));
  return `<div><div class="row" style="justify-content:space-between"><span class="small" style="font-weight:500">戻りの回数（最近${pts.length}回）</span><span class="small muted">前半 ${first.toFixed(1)} → 後半 ${last.toFixed(1)}</span></div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="瞑想ごとの戻りの回数の推移">
      ${ticks}
      <path d="${path}" fill="none" stroke="var(--moon)" stroke-width="1.8" stroke-linejoin="round"/>
      ${vals.map((v,i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === vals.length-1 ? 3.5 : 2.2}" fill="${i === vals.length-1 ? 'var(--accent)' : 'var(--moon)'}"/>`).join('')}
      <text x="${L}" y="${H-2}">${pts[0].date.slice(5).replace('-','/')}</text><text x="${W-30}" y="${H-2}">${pts[pts.length-1].date.slice(5).replace('-','/')}</text>
    </svg></div>`;
}
function medStatsPanel(){
  const all = [];
  Object.keys(S.days).sort().forEach(k => (S.days[k].sessions || []).forEach(x => all.push({ ...x, date:k })));
  if (!all.length) return `<section class="panel"><h3>瞑想のバリエーション</h3><p class="muted small">「今日」タブで呼吸のリズムや時間帯を変えて瞑想すると、ここで比べられます。</p></section>`;
  const per10 = arr => { const m = arr.reduce((a,x) => a + x.min, 0); return m ? (arr.reduce((a,x) => a + x.wander, 0) / m * 10) : 0; };
  const group = keyFn => { const g = {}; all.forEach(x => (g[keyFn(x)] = g[keyFn(x)] || []).push(x)); return Object.entries(g).sort((a,b) => b[1].length - a[1].length); };
  const lab = Object.fromEntries(SLOTS);
  const table = (title, rows, labFn) => `<div class="mtab"><div class="mrow mh"><span>${title}</span><span>回数</span><span>合計</span><span>戻り/10分</span></div>
    ${rows.map(([k, arr]) => `<div class="mrow"><span>${labFn(k)}</span><span class="mono">${arr.length}</span><span class="mono">${arr.reduce((a,x)=>a+x.min,0)}分</span><span class="mono">${per10(arr).toFixed(1)}</span></div>`).join('')}</div>`;
  const recent = all.slice(-5).reverse();
  return `<section class="panel">
    <div class="row" style="justify-content:space-between"><h3>瞑想のバリエーション</h3><span class="small muted">全${all.length}回</span></div>
    ${wanderTrend(all)}
    ${table('呼吸（吸-止-吐）', group(x => patLabel(x.pat)), k => k)}
    ${table('時間帯', group(x => x.slot), k => lab[k] || k)}
    <div class="sesslist"><span class="eyebrow">最近の5回</span>${recent.map(x => `<div class="sess"><span class="mono">${x.date.slice(5).replace('-','/')}</span><span>${lab[x.slot]||''}</span><span class="mono">${x.min}分</span><span class="mono">${patLabel(x.pat)}</span><span>戻り <b class="mono">${x.wander}</b></span></div>`).join('')}</div>
    <p class="hint">戻りの回数は、考えごとに気づいて呼吸に戻れた回数です。少ないほど良いとは限らないので、同じ条件で続けたときの変化を見ます。</p>
  </section>`;
}
/* ---------- data handover ---------- */
const APP_ID = 'hibi-note';
function dataSummary(d){
  const days = Object.values(d.days || {});
  const used = Object.keys(d.days || {}).filter(k => { const x = d.days[k]; return x && (x.journal || x.med || (x.habits||[]).length || (x.sessions||[]).length); }).sort();
  return {
    days: used.length, from: used[0] || null, to: used[used.length-1] || null,
    learns: (d.learns || []).length,
    sessions: days.reduce((a,x) => a + ((x && x.sessions) || []).length, 0),
    weeks: Object.values(d.weeks || {}).filter(w => w.tasks && w.tasks.length).length,
    habits: (d.habits || []).length
  };
}
const fmtDate = k => k ? k.replace(/-/g,'/') : '−';
function summaryList(sm){
  return `<ul class="dsum"><li><span>期間</span><b class="mono">${fmtDate(sm.from)} 〜 ${fmtDate(sm.to)}</b></li><li><span>記録した日</span><b class="mono">${sm.days}日</b></li><li><span>学び</span><b class="mono">${sm.learns}件</b></li><li><span>瞑想</span><b class="mono">${sm.sessions}回</b></li><li><span>週タスク</span><b class="mono">${sm.weeks}週分</b></li></ul>`;
}
function backupText(){ return JSON.stringify({ app: APP_ID, version: 1, exportedAt: new Date().toISOString(), data: S }); }
function backupName(){ return `hibi-note-${ymd(new Date())}.json`; }
function markBackedUp(){ S.lastBackup = Date.now(); save(); }
let pendingImport = null;
function dataPanel(){
  const sm = dataSummary(S), lb = S.lastBackup ? new Date(S.lastBackup) : null;
  const ago = lb ? Math.floor((Date.now() - lb) / 864e5) : null;
  const status = !lb ? 'まだバックアップがありません' : ago === 0 ? '今日バックアップ済み' : `${ago}日前にバックアップ`;
  return `<section class="panel" aria-labelledby="dh">
    <h3 id="dh">データの引き継ぎ</h3>
    <div class="dnote"><b>アプリを更新しても、記録は消えません。</b><span>GitHubでファイルを差し替えても、記録はこのiPhoneの中にそのまま残ります。</span></div>
    <p class="hint">ただし次のときは記録が消えるので、先にバックアップを作ってください：機種変更／ホーム画面のアイコンを削除して追加し直す／Safariの履歴とWebサイトデータを消去する。</p>
    <div class="dstatus ${!lb || ago > 14 ? 'warn' : ''}"><span>いまの記録</span><b>${status}</b></div>
    ${summaryList(sm)}

    <div class="dstep"><span class="qn">1</span><div><h3>バックアップを作る</h3><p class="hint">「ファイルに保存」で、iPhoneの「ファイル」アプリやiCloud Driveに保存できます。うまくいかないときは「コピー」して、メモアプリなどに貼っておきます。</p></div></div>
    <div class="row"><button class="btn primary" id="bk-file">ファイルに保存</button><button class="btn" id="bk-copy">コピー</button></div>
    <textarea id="dump" hidden readonly></textarea>

    <div class="dstep"><span class="qn">2</span><div><h3>バックアップから戻す</h3><p class="hint">新しいiPhoneや追加し直したアプリで使います。いまの記録は、バックアップの内容に置き換わります。</p></div></div>
    <div class="row"><label class="btn" for="rs-file" style="cursor:pointer">ファイルを選ぶ</label><input type="file" id="rs-file" accept="application/json,.json,.txt" class="vh"><button class="btn" id="rs-paste">貼り付けて戻す</button></div>
    <div id="rs-pastebox" hidden class="dcol"><textarea id="rs-text" placeholder="コピーしたバックアップをここに貼り付け"></textarea><button class="btn" id="rs-check">内容を確認する</button></div>
    <div id="rs-confirm"></div>
  </section>`;
}
function parseBackup(text){
  const j = JSON.parse(text);
  const d = j && j.app === APP_ID && j.data ? j.data : j;
  if (!d || !Array.isArray(d.habits) || typeof d.days !== 'object' || !Array.isArray(d.learns)) throw new Error('format');
  return { data: d, exportedAt: j && j.exportedAt };
}
function showImportConfirm(text){
  const box = document.getElementById('rs-confirm');
  try {
    const b = parseBackup(text); pendingImport = b.data;
    box.innerHTML = `<div class="dconfirm"><b>このバックアップで置き換えますか？</b>
      ${b.exportedAt ? `<span class="small muted">作成日時：${new Date(b.exportedAt).toLocaleString('ja-JP')}</span>` : ''}
      ${summaryList(dataSummary(b.data))}
      <div class="row"><button class="btn primary" id="rs-go">置き換える</button><button class="btn ghost" id="rs-cancel">やめる</button></div></div>`;
    document.getElementById('rs-go').onclick = () => {
      S = pendingImport; pendingImport = null;
      S.settings = Object.assign({ resetHour:2, iosTimer:false, simple:true }, S.settings); RESET = S.settings.resetHour; S.sample = false;
      refreshDay(); save(); header(); toast('バックアップから戻しました'); viewLife();
    };
    document.getElementById('rs-cancel').onclick = () => { pendingImport = null; box.innerHTML = ''; };
  } catch(e){
    pendingImport = null;
    box.innerHTML = `<p class="dconfirm small">このファイルは読み込めませんでした。「ファイルに保存」か「コピー」で作ったバックアップを選んでください。</p>`;
  }
}
function bindData(){
  document.getElementById('bk-file').onclick = async () => {
    const text = backupText(), name = backupName();
    try {
      const file = new File([text], name, { type:'application/json' });
      if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); markBackedUp(); toast('バックアップを保存しました'); viewLife(); return; }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type:'application/json' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      markBackedUp(); toast('バックアップをダウンロードしました'); viewLife();
    } catch(e){ toast('保存できませんでした。「コピー」を使ってください'); }
  };
  document.getElementById('bk-copy').onclick = async () => {
    const text = backupText();
    try { await navigator.clipboard.writeText(text); markBackedUp(); toast('バックアップをコピーしました。メモなどに貼っておきます'); viewLife(); }
    catch(e){ const t = document.getElementById('dump'); t.hidden = false; t.value = text; t.select(); markBackedUp(); toast('下の欄を長押しでコピーしてください'); }
  };
  document.getElementById('rs-file').onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => showImportConfirm(String(r.result)); r.readAsText(f);
  };
  document.getElementById('rs-paste').onclick = () => { const b = document.getElementById('rs-pastebox'); b.hidden = !b.hidden; };
  document.getElementById('rs-check').onclick = () => showImportConfirm(document.getElementById('rs-text').value);
}
function themeLabel(){ const t = document.documentElement.dataset.theme; return t==='dark'?'夜':t==='light'?'昼':'自動'; }

/* ---------- router ---------- */
let current = 'tonight';
const VIEWS = { tonight:viewTonight, habits:viewHabits, learn:viewLearn, know:viewKnow, life:viewLife };
function go(tab){
  current = tab; pendingDelete = null; pendingMove = false; if (tab !== 'habits'){ picking = false; wkView = 'cur'; }
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab===tab ? 'page' : 'false'));
  VIEWS[tab](); window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => go(t.dataset.tab));
document.getElementById('clear-sample').onclick = () => {
  S = { habits:S.habits, days:{}, learns:[], sample:false, settings:S.settings }; save(); header(); go(current); toast('サンプルを消しました');
};
try { const t = localStorage.getItem(KEY+'-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
header();
const hash = location.hash.slice(1);
go(VIEWS[hash] ? hash : 'tonight');
restoreTimer();
function onReturn(){
  if (document.visibilityState !== 'visible') return;
  if (refreshDay()){ header(); go(current); toast('新しい日になりました'); }
  if (timer.running){ tick(); keepAwake(); }
}
document.addEventListener('visibilitychange', onReturn);
window.addEventListener('pageshow', onReturn);
window.addEventListener('focus', onReturn);
setInterval(() => { const a = document.activeElement; if (a && /TEXTAREA|INPUT/.test(a.tagName)) return; if (refreshDay()){ header(); go(current); } }, 60000);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h]) go(h); });
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
